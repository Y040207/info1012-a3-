    <g stroke="#6b7d90" stroke-width="8" stroke-linecap="round">
      <line x1="180" y1="-20" x2="180" y2="40"/><line x1="420" y1="-20" x2="420" y2="40"/>
    </g>
  </g>
  <g transform="translate(150 470) rotate(-12)">
    <rect x="0" y="0" width="190" height="18" rx="6" fill="#f0c419"/>
    <path d="M190 0 l34 9 l-34 9 Z" fill="#e8d7a8"/>
    <path d="M222 9 l14 -6 l0 12 Z" fill="#46586b"/>
  </g>
  <text x="60" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#7b8b9c">four deadlines, one fortnight</text>
