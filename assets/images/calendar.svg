<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="A wall calendar with several dates circled in red pencil">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <g transform="translate(340 60)">
    <rect x="0" y="0" width="600" height="600" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="4"/>
    <rect x="0" y="0" width="600" height="110" rx="18" fill="#2f5fd0"/>
    <rect x="0" y="70" width="600" height="40" fill="#2f5fd0"/>
    <text x="300" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff">NOVEMBER</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7b8b9c">
      <text x="70" y="150" text-anchor="middle">M</text><text x="150" y="150" text-anchor="middle">T</text>
      <text x="230" y="150" text-anchor="middle">W</text><text x="310" y="150" text-anchor="middle">T</text>
      <text x="390" y="150" text-anchor="middle">F</text><text x="470" y="150" text-anchor="middle">S</text>
      <text x="550" y="150" text-anchor="middle">S</text>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#46586b">
      <text x="70" y="205" text-anchor="middle">2</text><text x="150" y="205" text-anchor="middle">3</text>
      <text x="230" y="205" text-anchor="middle">4</text><text x="310" y="205" text-anchor="middle">5</text>
      <text x="390" y="205" text-anchor="middle">6</text><text x="470" y="205" text-anchor="middle">7</text>
      <text x="550" y="205" text-anchor="middle">8</text>
      <text x="70" y="277" text-anchor="middle">9</text><text x="150" y="277" text-anchor="middle">10</text>
      <text x="230" y="277" text-anchor="middle">11</text><text x="310" y="277" text-anchor="middle">12</text>
      <text x="390" y="277" text-anchor="middle">13</text><text x="470" y="277" text-anchor="middle">14</text>
      <text x="550" y="277" text-anchor="middle">15</text>
      <text x="70" y="349" text-anchor="middle">16</text><text x="150" y="349" text-anchor="middle">17</text>
      <text x="230" y="349" text-anchor="middle">18</text><text x="310" y="349" text-anchor="middle">19</text>
      <text x="390" y="349" text-anchor="middle">20</text><text x="470" y="349" text-anchor="middle">21</text>
      <text x="550" y="349" text-anchor="middle">22</text>
      <text x="70" y="421" text-anchor="middle">23</text><text x="150" y="421" text-anchor="middle">24</text>
      <text x="230" y="421" text-anchor="middle">25</text><text x="310" y="421" text-anchor="middle">26</text>
      <text x="390" y="421" text-anchor="middle">27</text><text x="470" y="421" text-anchor="middle">28</text>
      <text x="550" y="421" text-anchor="middle">29</text>
      <text x="70" y="493" text-anchor="middle">30</text>
    </g>
    <g fill="none" stroke="#d14343" stroke-width="4" stroke-linecap="round">
